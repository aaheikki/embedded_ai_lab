site_name: Embedded AI Laboratory
copyright: |
    © 2026 Aaro Heikkinen aaro.heikkinen@uef.fi

theme:
  name: material

  features:
    - content.code.copy # copy icon to code blocks

  logo: assets/UEF_Favicon_192x192.png
  favicon: assets/UEF_Favicon_192x192.png

  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Side navigation bar
nav:
  - Home: index.md

  - Getting Started: getting_started.md   
  - Embedded AI Software Platform: embedded_ai_software_platform.md

  - Guides:
    - Version Control Guide: version_control_guide.md
    - Documentation Guide: documentation_guide.md
    
  - Pilot Projects:
    - PCB Assembly Line: assembly_line.md
    - Drone Swarm: drone_swarm.md
    - Pipeline Control System: pipe_line_control_system.md
    - Humanoid Robot: humanoid_robot.md

extra: # footer
  social:    
    - icon: fontawesome/solid/university
      link: https://uefconnect.uef.fi/en/sute/
      name: Project Home page

    - icon: fontawesome/brands/github
      link: https://github.com/aaheikki/embedded_ai_lab
      name: GitHub repository      

    - icon: fontawesome/solid/bug
      link: https://github.com/aaheikki/embedded_ai_lab/issues
      name: Report an issue

# Custom theme color 
extra_css:
  - stylesheets/uef.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  